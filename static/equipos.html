<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Fútbol - Equipos</title>
</head>
<body>

    <h1>Listado de Equipos</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Formación Actual</th>
            </tr>
        </thead>
        <tbody id="tabla-equipos">
            <tr>
                <td colspan="3">Cargando equipos...</td>
            </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/api/equipos')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error en la petición: ${response.status}`);
                    }
                    return response.json();
                })
                .then(equipos => {
                    const tbody = document.getElementById('tabla-equipos');
                    tbody.innerHTML = ''; // Limpia el mensaje de carga

                    if (equipos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3">No hay equipos registrados.</td></tr>';
                        return;
                    }

                    // Renderiza las filas con los nombres de claves exactos recibidos en JSON
                    equipos.forEach(equipo => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${equipo.id}</td>
                            <td>${equipo.nombre}</td>
                            <td>${equipo.formacion_actual}</td>
                        `;
                        tbody.appendChild(fila);
                    });
                })
                .catch(error => {
                    console.error('Error al cargar equipos:', error);
                    const tbody = document.getElementById('tabla-equipos');
                    tbody.innerHTML = `<tr><td colspan="3" style="color:red;">Error al cargar datos.</td></tr>`;
                });
        });
    </script>

</body>
</html>
