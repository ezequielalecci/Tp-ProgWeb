<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Fútbol</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        h1, h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        button { cursor: pointer; padding: 5px 10px; margin-right: 5px; border: none; border-radius: 3px; }
        .btn-update { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn-create { background: #28a745; color: #fff; padding: 8px 12px; margin-bottom: 10px; }
        .form-container { background: #fff; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Panel de Administración</h1>

    <!-- EQUIPOS -->
    <h2>Equipos</h2>
    <div class="form-container">
        <h3>Crear Equipo</h3>
        <input type="text" id="eq-nombre" placeholder="Nombre">
        <input type="text" id="eq-formacion" placeholder="Formación (ej: 4-3-3)">
        <input type="number" id="eq-valoracion" placeholder="Valoración (0-99)">
        <input type="number" id="eq-posicion" placeholder="Posición Tabla">
        <button class="btn-create" onclick="crearEquipo()">Crear Equipo</button>
    </div>

    <table id="tabla-equipos">
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Formación</th><th>Valoración</th><th>Posición</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- JUGADORES -->
    <h2>Jugadores</h2>
    <table id="tabla-jugadores">
        <thead>
            <tr>
                <th>ID</th><th>Equipo ID</th><th>Nombre</th><th>Posición</th><th>Media</th><th>Goles</th><th>Asistencias</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- PARTIDOS -->
    <h2>Partidos</h2>
    <div class="form-container">
        <h3>Crear Partido</h3>
        <input type="number" id="part-local" placeholder="ID Equipo Local">
        <input type="number" id="part-visita" placeholder="ID Equipo Visitante">
        <input type="date" id="part-fecha">
        <button class="btn-create" onclick="crearPartido()">Crear Partido</button>
    </div>

    <table id="tabla-partidos">
        <thead>
            <tr>
                <th>ID</th><th>Local</th><th>Visitante</th><th>Goles L</th><th>Goles V</th><th>Estado</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const API_BASE = '/api';

        async function cargarDatos() {
            await cargarEquipos();
            await cargarJugadores();
            await cargarPartidos();
        }

        // --- EQUIPOS ---
        async function cargarEquipos() {
            const res = await fetch(`${API_BASE}/equipos`);
            const equipos = await res.json();
            
            const tbody = document.querySelector('#tabla-equipos tbody');
            tbody.innerHTML = '';

            (equipos || []).forEach(eq => {
                tbody.innerHTML += `
                    <tr>
                        <td>${eq.id}</td>
                        <td>${eq.nombre}</td>
                        <td>${eq.formacion_actual}</td>
                        <td>${eq.valoracion}</td>
                        <td>${eq.posicion_tabla}</td>
                        <td>
                            <button class="btn-update" onclick="actualizarEquipo(${eq.id})">Editar</button>
                            <button class="btn-delete" onclick="eliminarEquipo(${eq.id})">Eliminar</button>
                        </td>
                    </tr>`;
            });
        }

        async function crearEquipo() {
            const body = {
                nombre: document.getElementById('eq-nombre').value,
                formacion_actual: document.getElementById('eq-formacion').value,
                valoracion: parseInt(document.getElementById('eq-valoracion').value) || 0,
                posicion_tabla: parseInt(document.getElementById('eq-posicion').value) || 0
            };

            await fetch(`${API_BASE}/equipos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            cargarEquipos();
        }

        async function actualizarEquipo(id) {
            const nuevoNombre = prompt("Nuevo nombre del equipo:");
            const nuevaFormacion = prompt("Nueva formación (ej: 4-4-2):");
            const nuevaPosTabla = parseInt(prompt("Nueva Posición en la Tabla:"));
            if (!nuevoNombre || !nuevaFormacion || isNaN(nuevaPosTabla)) return;

            await fetch(`${API_BASE}/equipos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: nuevoNombre,
                    formacion_actual: nuevaFormacion,
                    valoracion: 85,
                    posicion_tabla: nuevaPosTabla
                })
            });
            cargarEquipos();
        }

        async function eliminarEquipo(id) {
            if (!confirm("¿Eliminar equipo?")) return;
            await fetch(`${API_BASE}/equipos/${id}`, { method: 'DELETE' });
            cargarEquipos();
        }

        // --- JUGADORES ---
        async function cargarJugadores() {
            const res = await fetch(`${API_BASE}/jugadores`);
            const jugadores = await res.json();
            
            const tbody = document.querySelector('#tabla-jugadores tbody');
            tbody.innerHTML = '';
            (jugadores || []).forEach(j => {
                tbody.innerHTML += `
                    <tr>
                        <td>${j.id}</td>
                        <td>${j.equipo_id}</td>
                        <td>${j.nombre}</td>
                        <td>${j.posicion}</td>
                        <td>${j.media_general}</td>
                        <td>${j.goles}</td>
                        <td>${j.asistencias}</td>
                        <td>
                            <button class="btn-update" onclick="actualizarStats(${j.id}, ${j.goles}, ${j.asistencias})">Modificar Stats</button>
                            <button class="btn-delete" onclick="eliminarJugador(${j.id})">Eliminar</button>
                        </td>
                    </tr>`;
            });
        }

        async function actualizarStats(id, golesActuales, asistenciasActuales) {
            const nuevosGoles = parseInt(prompt("Cantidad total de Goles:", golesActuales));
            const nuevasAsistencias = parseInt(prompt("Cantidad total de Asistencias:", asistenciasActuales));
            
            if (isNaN(nuevosGoles) || isNaN(nuevasAsistencias)) return;

            await fetch(`${API_BASE}/jugador/${id}/stats`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    goles: nuevosGoles, 
                    asistencias: nuevasAsistencias 
                })
            });
            
            cargarJugadores();
        }

        async function eliminarJugador(id) {
            if (!confirm("¿Eliminar jugador?")) return;
            await fetch(`${API_BASE}/jugador/${id}`, { method: 'DELETE' });
            cargarJugadores();
        }

        // --- PARTIDOS ---
        async function cargarPartidos() {
            const res = await fetch(`${API_BASE}/partidos`);
            const partidos = await res.json();
            const tbody = document.querySelector('#tabla-partidos tbody');
            tbody.innerHTML = '';
            (partidos || []).forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.equipo_local_id}</td>
                        <td>${p.equipo_visitante_id}</td>
                        <td>${p.goles_local}</td>
                        <td>${p.goles_visitante}</td>
                        <td>${p.estado}</td>
                        <td>
                            <button class="btn-update" onclick="actualizarResultado(${p.id})">Resultado</button>
                            <button class="btn-delete" onclick="eliminarPartido(${p.id})">Eliminar</button>
                        </td>
                    </tr>`;
            });
        }

        async function crearPartido() {
            const body = {
                equipo_local_id: parseInt(document.getElementById('part-local').value),
                equipo_visitante_id: parseInt(document.getElementById('part-visita').value),
                fecha: document.getElementById('part-fecha').value,
                estado: "PENDIENTE"
            };

            await fetch(`${API_BASE}/partidos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            cargarPartidos();
        }

        async function actualizarResultado(id) {
            const gLocal = parseInt(prompt("Goles local:"));
            const gVisita = parseInt(prompt("Goles visitante:"));
            if (isNaN(gLocal) || isNaN(gVisita)) return;

            await fetch(`${API_BASE}/partidos/${id}/resultado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    goles_local: gLocal, 
                    goles_visitante: gVisita, 
                    estado: 'FINALIZADO' 
                })
            });
            cargarPartidos();
        }

        async function eliminarPartido(id) {
            if (!confirm("¿Eliminar partido?")) return;
            await fetch(`${API_BASE}/partidos/${id}`, { method: 'DELETE' });
            cargarPartidos();
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
