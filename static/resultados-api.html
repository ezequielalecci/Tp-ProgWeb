<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Fútbol</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        h1, h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        button { cursor: pointer; padding: 6px 12px; margin-right: 5px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-update { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn-create { background: #28a745; color: #fff; padding: 8px 12px; margin-top: 10px; display: inline-block; }
        
        /* Formulario estructurado con etiquetas */
        .form-container { background: #fff; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 4px; }
        .form-grid { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
        .form-group input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }

        /* Contenedor de notificaciones flotantes */
        #alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease-in-out;
        }
        .alert-success { background-color: #28a745; }
        .alert-error { background-color: #dc3545; }
        .alert-close {
            margin-left: 15px;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Banner Notificaciones -->
    <div id="alert-container"></div>

    <h1>Panel de Administración</h1>

    <!-- EQUIPOS -->
    <h2>Equipos</h2>
    <div class="form-container">
        <h3>Crear Equipo</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="eq-nombre">Nombre del Equipo</label>
                <input type="text" id="eq-nombre" placeholder="Ej: Barcelona">
            </div>
            <div class="form-group">
                <label for="eq-formacion">Formación</label>
                <input type="text" id="eq-formacion" placeholder="Ej: 4-3-3">
            </div>
            <div class="form-group">
                <label for="eq-valoracion">Valoración (0-99)</label>
                <input type="number" id="eq-valoracion" placeholder="Ej: 85">
            </div>
            <div class="form-group">
                <label for="eq-posicion">Posición en Tabla</label>
                <input type="number" id="eq-posicion" placeholder="Ej: 1">
            </div>
        </div>
        <button class="btn-create" onclick="crearEquipo()">Crear Equipo</button>
    </div>

    <table id="tabla-equipos">
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Formación</th><th>Valoración</th><th>Posición</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

  
    <h2>Jugadores</h2>
    <div class="form-container">
        <h3>Crear Jugador</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="jug-equipo">ID del Equipo</label>
                <input type="number" id="jug-equipo" placeholder="Ej: 1">
            </div>
            <div class="form-group">
                <label for="jug-nombre">Nombre del Jugador</label>
                <input type="text" id="jug-nombre" placeholder="Ej: Lionel Messi">
            </div>
            <div class="form-group">
                <label for="jug-posicion">Posición</label>
                <input type="text" id="jug-posicion" placeholder="Ej: DEL, MED, DEF">
            </div>
            <div class="form-group">
                <label for="jug-fecha-nac">Fecha de Nacimiento</label>
                <input type="date" id="jug-fecha-nac">
            </div>
            <div class="form-group">
                <label for="jug-media">Media (0-99)</label>
                <input type="number" id="jug-media" placeholder="Ej: 90">
            </div>

         
            <div class="form-group">
                <label for="jug-altura">Altura (cm)</label>
                <input type="number" id="jug-altura" placeholder="Ej: 170">
            </div>
            <div class="form-group">
                <label for="jug-ritmo">Ritmo (0-99)</label>
                <input type="number" id="jug-ritmo" placeholder="Ej: 85">
            </div>
            <div class="form-group">
                <label for="jug-tiro">Tiro (0-99)</label>
                <input type="number" id="jug-tiro" placeholder="Ej: 88">
            </div>
            <div class="form-group">
                <label for="jug-pase">Pase (0-99)</label>
                <input type="number" id="jug-pase" placeholder="Ej: 91">
            </div>
            <div class="form-group">
                <label for="jug-regate">Regate (0-99)</label>
                <input type="number" id="jug-regate" placeholder="Ej: 94">
            </div>
            <div class="form-group">
                <label for="jug-defensa">Defensa (0-99)</label>
                <input type="number" id="jug-defensa" placeholder="Ej: 35">
            </div>
            <div class="form-group">
                <label for="jug-fisico">Físico (0-99)</label>
                <input type="number" id="jug-fisico" placeholder="Ej: 65">
            </div>
        </div>
        <button class="btn-create" onclick="crearJugador()">Crear Jugador</button>
    </div>

    <table id="tabla-jugadores">
        <thead>
            <tr>
                <th>ID</th><th>Equipo ID</th><th>Nombre</th><th>Posición</th><th>Media</th><th>Goles</th><th>Asistencias</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- PARTIDOS -->
    <h2>Partidos</h2>
    <div class="form-container">
        <h3>Crear Partido</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="part-local">ID Equipo Local</label>
                <input type="number" id="part-local" placeholder="Ej: 1">
            </div>
            <div class="form-group">
                <label for="part-visita">ID Equipo Visitante</label>
                <input type="number" id="part-visita" placeholder="Ej: 2">
            </div>
            <div class="form-group">
                <label for="part-fecha">Fecha del Partido</label>
                <input type="date" id="part-fecha">
            </div>
        </div>
        <button class="btn-create" onclick="crearPartido()">Crear Partido</button>
    </div>

    <table id="tabla-partidos">
        <thead>
            <tr>
                <th>ID</th><th>Local</th><th>Visitante</th><th>Goles L</th><th>Goles V</th><th>Estado</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const API_BASE = '/api';

        // --- SISTEMA DE NOTIFICACIONES ---
        function mostrarNotificacion(mensaje, esError = false) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert ${esError ? 'alert-error' : 'alert-success'}`;
            
            alert.innerHTML = `
                <span>${mensaje}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(alert);

            setTimeout(() => {
                if (alert.parentElement) {
                    alert.style.opacity = '0';
                    setTimeout(() => alert.remove(), 300);
                }
            }, 4000);
        }

        async function cargarDatos() {
            await cargarEquipos();
            await cargarJugadores();
            await cargarPartidos();
        }

        // --- EQUIPOS ---
        async function cargarEquipos() {
            try {
                const res = await fetch(`${API_BASE}/equipos`);
                if (!res.ok) throw new Error("Error al obtener equipos");
                const equipos = await res.json();
                
                const tbody = document.querySelector('#tabla-equipos tbody');
                tbody.innerHTML = '';

                (equipos || []).forEach(eq => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${eq.id}</td>
                            <td>${eq.nombre}</td>
                            <td>${eq.formacion_actual}</td>
                            <td>${eq.valoracion}</td>
                            <td>${eq.posicion_tabla}</td>
                            <td>
                                <button class="btn-update" onclick="actualizarEquipo(${eq.id})">Editar</button>
                                <button class="btn-delete" onclick="eliminarEquipo(${eq.id})">Eliminar</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function crearEquipo() {
            const body = {
                nombre: document.getElementById('eq-nombre').value,
                formacion_actual: document.getElementById('eq-formacion').value,
                valoracion: parseInt(document.getElementById('eq-valoracion').value) || 0,
                posicion_tabla: parseInt(document.getElementById('eq-posicion').value) || 0
            };

            try {
                const res = await fetch(`${API_BASE}/equipos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'No se pudo crear el equipo', true);
                    return;
                }

                mostrarNotificacion('¡Equipo creado con éxito!');
                
                document.getElementById('eq-nombre').value = '';
                document.getElementById('eq-formacion').value = '';
                document.getElementById('eq-valoracion').value = '';
                document.getElementById('eq-posicion').value = '';

                await cargarEquipos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function actualizarEquipo(id) {
            const nuevoNombre = prompt("Nuevo nombre del equipo:");
            if (nuevoNombre === null) return;
            const nuevaFormacion = prompt("Nueva formación (ej: 4-4-2):");
            if (nuevaFormacion === null) return;
            const nuevaPosTabla = parseInt(prompt("Nueva Posición en la Tabla:"));
            if (isNaN(nuevaPosTabla)) {
                mostrarNotificacion('La posición en la tabla debe ser un número', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/equipos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nuevoNombre,
                        formacion_actual: nuevaFormacion,
                        valoracion: 85,
                        posicion_tabla: nuevaPosTabla
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'Error al actualizar el equipo', true);
                    return;
                }

                mostrarNotificacion('Equipo actualizado correctamente');
                await cargarEquipos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function eliminarEquipo(id) {
            if (!confirm("¿Eliminar equipo?")) return;

            try {
                const res = await fetch(`${API_BASE}/equipos/${id}`, { method: 'DELETE' });
                
                if (!res.ok) {
                    const data = await res.json();
                    mostrarNotificacion(data.error || 'Error al eliminar el equipo', true);
                    return;
                }

                mostrarNotificacion('Equipo eliminado correctamente');
                await cargarEquipos();
                await cargarPartidos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        // --- JUGADORES ---
        async function cargarJugadores() {
            try {
                const res = await fetch(`${API_BASE}/jugadores`);
                if (!res.ok) throw new Error("Error al obtener jugadores");
                const jugadores = await res.json();
                
                const tbody = document.querySelector('#tabla-jugadores tbody');
                tbody.innerHTML = '';
                (jugadores || []).forEach(j => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${j.id}</td>
                            <td>${j.equipo_id}</td>
                            <td>${j.nombre}</td>
                            <td>${j.posicion}</td>
                            <td>${j.media_general}</td>
                            <td>${j.goles}</td>
                            <td>${j.asistencias}</td>
                            <td>
                                <button class="btn-update" onclick="actualizarStats(${j.id}, ${j.goles}, ${j.asistencias})">Modificar Stats</button>
                                <button class="btn-delete" onclick="eliminarJugador(${j.id})">Eliminar</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function crearJugador() {
            const body = {
                equipo_id: parseInt(document.getElementById('jug-equipo').value) || 0,
                nombre: document.getElementById('jug-nombre').value,
                posicion: document.getElementById('jug-posicion').value,
                fecha_nacimiento: document.getElementById('jug-fecha-nac').value,
                media_general: parseInt(document.getElementById('jug-media').value) || 0,
                
                // Atributos obligatorios ingresados por el usuario
                altura: document.getElementById('jug-altura').value || "1.70",
                ritmo: parseInt(document.getElementById('jug-ritmo').value) || 0,
                tiro: parseInt(document.getElementById('jug-tiro').value) || 0,
                pase: parseInt(document.getElementById('jug-pase').value) || 0,
                regate: parseInt(document.getElementById('jug-regate').value) || 0,
                defensa: parseInt(document.getElementById('jug-defensa').value) || 0,
                fisico: parseInt(document.getElementById('jug-fisico').value) || 0
            };

            try {
                const res = await fetch(`${API_BASE}/jugadores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'Error al crear el jugador', true);
                    return;
                }

                mostrarNotificacion('¡Jugador creado con éxito!');

                // Limpieza de campos del formulario
                document.getElementById('jug-equipo').value = '';
                document.getElementById('jug-nombre').value = '';
                document.getElementById('jug-posicion').value = '';
                document.getElementById('jug-fecha-nac').value = '';
                document.getElementById('jug-media').value = '';
                document.getElementById('jug-altura').value = '';
                document.getElementById('jug-ritmo').value = '';
                document.getElementById('jug-tiro').value = '';
                document.getElementById('jug-pase').value = '';
                document.getElementById('jug-regate').value = '';
                document.getElementById('jug-defensa').value = '';
                document.getElementById('jug-fisico').value = '';

                await cargarJugadores();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function actualizarStats(id, golesActuales, asistenciasActuales) {
            const nuevosGolesStr = prompt("Cantidad total de Goles:", golesActuales);
            if (nuevosGolesStr === null) return;
            const nuevasAsistenciasStr = prompt("Cantidad total de Asistencias:", asistenciasActuales);
            if (nuevasAsistenciasStr === null) return;

            const nuevosGoles = parseInt(nuevosGolesStr);
            const nuevasAsistencias = parseInt(nuevasAsistenciasStr);
            
            if (isNaN(nuevosGoles) || isNaN(nuevasAsistencias)) {
                mostrarNotificacion('Goles y asistencias deben ser números enteros', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/jugadores/${id}/stats`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        goles: nuevosGoles, 
                        asistencias: nuevasAsistencias 
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'Error al actualizar las estadísticas', true);
                    return;
                }

                mostrarNotificacion('Estadísticas del jugador actualizadas');
                await cargarJugadores();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function eliminarJugador(id) {
            if (!confirm("¿Eliminar jugador?")) return;

            try {
                const res = await fetch(`${API_BASE}/jugadores/${id}`, { method: 'DELETE' });

                if (!res.ok) {
                    const data = await res.json();
                    mostrarNotificacion(data.error || 'Error al eliminar el jugador', true);
                    return;
                }

                mostrarNotificacion('Jugador eliminado con éxito');
                await cargarJugadores();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }


// Función auxiliar para extraer el ID numérico de un campo sql.NullInt32 de Go
function obtenerID(campoNullInt) {
    if (campoNullInt === null || campoNullInt === undefined) return null;
    // Si Go lo envió como objeto sql.NullInt32 { Int32: 5, Valid: true }
    if (typeof campoNullInt === 'object') {
        return campoNullInt.Valid ? campoNullInt.Int32 : null;
    }
    // Si en algún endpoint viene como número primitivo
    return campoNullInt;
}

async function cargarPartidos() {
    try {
        // 1. Obtener partidos y equipos en paralelo
        const [resPartidos, resEquipos] = await Promise.all([
            fetch(`${API_BASE}/partidos`),
            fetch(`${API_BASE}/equipos`)
        ]);

        if (!resPartidos.ok) throw new Error("Error al obtener partidos");
        
        const partidos = await resPartidos.json();
        let mapaEquipos = {};

        if (resEquipos.ok) {
            const equipos = await resEquipos.json();
            equipos.forEach(e => {
                mapaEquipos[e.id] = e.nombre;
            });
        }

        const tbody = document.querySelector('#tabla-partidos tbody');
        tbody.innerHTML = '';

        (partidos || []).forEach(p => {
            // Extraer el ID real teniendo en cuenta la estructura sql.NullInt32
            const idLocal = obtenerID(p.equipo_local_id);
            const idVisitante = obtenerID(p.equipo_visitante_id);

            // Buscar en el mapa de equipos
            const nombreLocal = idLocal ? (mapaEquipos[idLocal] || 'Equipo Eliminado') : 'Equipo Eliminado';
            const nombreVisitante = idVisitante ? (mapaEquipos[idVisitante] || 'Equipo Eliminado') : 'Equipo Eliminado';

            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${nombreLocal}</td>
                    <td>${nombreVisitante}</td>
                    <td>${p.goles_local ?? 0}</td>
                    <td>${p.goles_visitante ?? 0}</td>
                    <td>${p.estado}</td>
                    <td>
                        <button class="btn-update" onclick="actualizarResultado(${p.id})">Resultado</button>
                        <button class="btn-delete" onclick="eliminarPartido(${p.id})">Eliminar</button>
                    </td>
                </tr>`;
        });
    } catch (err) {
        console.error("Error al cargar partidos:", err);
    }
}


        async function crearPartido() {
            const body = {
                equipo_local_id: parseInt(document.getElementById('part-local').value) || 0,
                equipo_visitante_id: parseInt(document.getElementById('part-visita').value) || 0,
                fecha: document.getElementById('part-fecha').value,
                estado: "PENDIENTE"
            };

            try {
                const res = await fetch(`${API_BASE}/partidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'Error al crear el partido', true);
                    return;
                }

                mostrarNotificacion('¡Partido programado con éxito!');

                document.getElementById('part-local').value = '';
                document.getElementById('part-visita').value = '';
                document.getElementById('part-fecha').value = '';

                await cargarPartidos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function actualizarResultado(id) {
            const gLocalStr = prompt("Goles local:");
            if (gLocalStr === null) return;
            const gVisitaStr = prompt("Goles visitante:");
            if (gVisitaStr === null) return;

            const gLocal = parseInt(gLocalStr);
            const gVisita = parseInt(gVisitaStr);

            if (isNaN(gLocal) || isNaN(gVisita)) {
                mostrarNotificacion('Los goles deben ser números enteros', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/partidos/${id}/resultado`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        goles_local: gLocal, 
                        goles_visitante: gVisita, 
                        estado: 'FINALIZADO' 
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarNotificacion(data.error || 'Error al actualizar el resultado', true);
                    return;
                }

                mostrarNotificacion('Resultado del partido actualizado');
                await cargarPartidos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        async function eliminarPartido(id) {
            if (!confirm("¿Eliminar partido?")) return;

            try {
                const res = await fetch(`${API_BASE}/partidos/${id}`, { method: 'DELETE' });

                if (!res.ok) {
                    const data = await res.json();
                    mostrarNotificacion(data.error || 'Error al eliminar el partido', true);
                    return;
                }

                mostrarNotificacion('Partido eliminado con éxito');
                await cargarPartidos();
            } catch (err) {
                mostrarNotificacion('Error de conexión con el servidor', true);
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
