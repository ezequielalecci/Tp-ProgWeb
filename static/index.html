<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados · Equipos, jugadores y partidos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1>Resultados de la liga</h1>
    <p>Consultá y cargá equipos, jugadores y partidos</p>
    <nav role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="toolbar">
    <select id="teamFilter" aria-label="Filtrar por equipo" style="max-width:220px;display:none"></select>
    <span class="count" id="count"></span>
    <span class="grow"></span>
    <button class="btn primary" id="add"></button>
  </div>
  <div class="tablewrap"><table><thead></thead><tbody></tbody></table></div>
</main>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
