services:
  app:
    build: .
    container_name: gestion_futbol_app
    restart: always
    ports:
      - "8080:8080"
    env_file:     
      - .env
    depends_on:
      postgres:
        condition: service_healthy 

  postgres:
    image: postgres:15-alpine
    container_name: gestion_futbol_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/test-data.sql:/docker-entrypoint-initdb.d/2_test-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: