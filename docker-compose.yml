services:

  app:
    build: .
    container_name: gestion_futbol_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        #Verifica que postgres alla comenzado y este funcionando antes de poner en marcha la aplicacion
        condition: service_healthy 

  postgres:
    image: postgres:15-alpine
    container_name: gestion_futbol_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gestion_futbol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/test-data.sql:/docker-entrypoint-initdb.d/2_test-data.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_futbol"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: